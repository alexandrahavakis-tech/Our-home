let chores=JSON.parse(JSON.stringify(IC));
let log=[];
let cat="all",person="everyone",imbalStart=null,svTimer=null,chartOn=false;

function ds(d){if(!d)return null;return Math.floor((Date.now()-new Date(d).getTime())/864e5);}
function od(c){const d=ds(c.lastDone);if(d===null)return true;return d>=(ODD[c.frequency]||9);}
function sc(c){const f=FPM[c.frequency]||1;const w=(c.effort&&c.mentalLoad)?{e:c.effort,m:c.mentalLoad}:(CW[c.id]||{e:2,m:1});return f*w.e*w.m;}
function loads(){let a=0,l=0;chores.forEach(c=>{const s=sc(c);if(c.owner==="alex")a+=s;else if(c.owner==="liam")l+=s;else{a+=s/2;l+=s/2;}});return{a:Math.round(a),l:Math.round(l),t:Math.round(a+l)};}
function own(c){return c.owner==="rotate"?c.rotationTurn:c.owner;}
function nid(){return chores.reduce((m,c)=>Math.max(m,c.id),0)+1;}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(",");}

async function boot(){
  try{
    const rows=await sbGet("chores");
    const d=rows.filter(r=>r.id!=="__meta__").map(r=>r.data);
    if(d.length>0){chores=d;}else{await save();}
    const lg=await sbGet("activity_log","?order=created_at.asc");
    log=lg.map(r=>({who:r.who,score:r.score,date:r.created_at,name:r.chore_name}));
    const m=rows.find(r=>r.id==="__meta__");
    if(m&&m.data&&m.data.imbalance)imbalStart=m.data.imbalance;
  }catch(e){try{const s=localStorage.getItem("ch");if(s)chores=JSON.parse(s);}catch(x){}}
  render();
  try{
    const ws=new WebSocket(SB_URL.replace("https://","wss://")+"/realtime/v1/websocket?apikey="+SB_KEY+"&vsn=1.0.0");
    ws.onopen=()=>ws.send(JSON.stringify({topic:"realtime:public:chores",event:"phx_join",payload:{},ref:"1"}));
    ws.onmessage=async e=>{
      const msg=JSON.parse(e.data);
      if(["INSERT","UPDATE","DELETE"].includes(msg.event)){
        const rows=await sbGet("chores");
        const d=rows.filter(r=>r.id!=="__meta__").map(r=>r.data);
        if(d.length>0){chores=d;render();}
      }
    };
  }catch(e){}
}
function setSyncing(v){document.getElementById("sync-dot").style.background=v?"#F0A050":"#5BAD7A";}
function save(){
  clearTimeout(svTimer);
  svTimer=setTimeout(async()=>{
    setSyncing(true);
    await sbUpsert("chores",chores.map(c=>({id:String(c.id),data:c})));
    try{localStorage.setItem("ch",JSON.stringify(chores));}catch(e){}
    setSyncing(false);
  },800);
}
async function logA(c,who){
  const s=sc(c);log.push({who,score:s,date:new Date().toISOString(),name:c.name});
  await sbInsert("activity_log",{who,score:s,chore_name:c.name});
}

function render(){
  rLegend();rTabs();rPills();rStats();rChores();chkImbal();
}

function rLegend(){
  document.getElementById("legend").innerHTML=Object.entries(PEOPLE).map(([k,p])=>`<div style="display:flex;align-items:center;gap:3px;font-size:10px;color:#AAA"><div style="width:8px;height:8px;border-radius:2px;background:${p.color}"></div>${p.emoji}</div>`).join("");
}
function rTabs(){
  const odc={};chores.forEach(c=>{if(od(c)){odc[c.category]=(odc[c.category]||0)+1;odc.all=(odc.all||0)+1;}});
  document.getElementById("cat-tabs").innerHTML=CATS.map(x=>`<button class="cat-tab${cat===x.key?" active":""}" onclick="setCat('${x.key}')"><span class="te">${x.emoji}</span><span class="tl">${x.label}</span>${odc[x.key]?'<span class="odot"></span>':""}</button>`).join("");
}
function rPills(){
  document.getElementById("person-pills").innerHTML=[{key:"everyone",label:"Everyone",emoji:"👥"},{key:"alex",label:"Alex",emoji:"🌸"},{key:"liam",label:"Liam",emoji:"⚡"},{key:"overdue",label:"Overdue",emoji:"⚠️"}].map(p=>`<button class="ppill${person===p.key?" active":""}" onclick="setPers('${p.key}')">${p.emoji} ${p.label}</button>`).join("");
}
function rStats(){
  const {a,l,t}=loads();const ap=Math.round((a/t)*100),lp=100-ap;
  const bal=Math.abs(ap-50)<=5;const odc=chores.filter(od).length;
  const ac=chores.filter(c=>c.owner==="alex"||(c.owner==="rotate"&&c.rotationTurn==="alex")).length;
  const lc=chores.filter(c=>c.owner==="liam"||(c.owner==="rotate"&&c.rotationTurn==="liam")).length;
  let alert="";
  if(imbalStart){const days=Math.floor((Date.now()-imbalStart.since)/864e5);if(days>=10)alert=`<div class="ialert"><span style="font-size:18px;flex-shrink:0">⚠️</span><div><div style="font-size:12px;font-weight:700;color:#C06020">Load imbalance alert</div><div style="font-size:11px;color:#A05010;margin-top:2px">${imbalStart.person} has been carrying 60%+ of chores for 10+ days. Use ⇄ to rebalance.</div></div></div>`;}
  document.getElementById("stats").innerHTML=`${alert}
  <div class="bal-card">
    <div class="bal-title-row"><span class="bal-lbl">Monthly load balance</span><span class="bal-status" style="color:${bal?"#5BAD7A":"#D06060"};background:${bal?"#E8F8EE":"#FDE8E8"}">${bal?"✓ Balanced":Math.abs(ap-lp)+"% gap"}</span></div>
    <div class="bar-wrap"><div class="bar-seg" style="width:${ap}%;background:${PEOPLE.alex.color}"><span>${ap}%</span></div><div class="bar-seg" style="flex:1;background:${PEOPLE.liam.color}"><span>${lp}%</span></div></div>
    <div class="bal-pts"><span>${PEOPLE.alex.emoji} Alex · ${a} pts</span><span>${l} pts · Liam ${PEOPLE.liam.emoji}</span></div>
    <div class="bal-note">Score = effort x frequency x mental load</div>
    <button class="chart-toggle" onclick="toggleChart()">📊 ${chartOn?"Hide":"Show"} 4-week history</button>
    <div id="chrt" style="display:${chartOn?"block":"none"};margin-top:12px;padding-top:12px;border-top:1px solid #F0EEEB">${rChart()}</div>
  </div>
  <div class="cnt-grid">
    <div class="cnt-card"><div class="cnt-emoji">${PEOPLE.alex.emoji}</div><div class="cnt-val" style="color:${PEOPLE.alex.color}">${ac}</div><div class="cnt-lbl">Alex s chores</div></div>
    <div class="cnt-card"><div class="cnt-emoji">${PEOPLE.liam.emoji}</div><div class="cnt-val" style="color:${PEOPLE.liam.color}">${lc}</div><div class="cnt-lbl">Liam s chores</div></div>
    <div class="cnt-card"><div class="cnt-emoji">⚠️</div><div class="cnt-val" style="color:${odc>0?"#D06060":"#90C090"}">${odc}</div><div class="cnt-lbl">Need attention</div></div>
  </div>`;
}
function rChart(){
  const now=Date.now();
  const wks=[0,1,2,3].map(i=>{const s=now-(4-i)*7*864e5,e=now-(3-i)*7*864e5;const en=log.filter(x=>new Date(x.date).getTime()>=s&&new Date(x.date).getTime()<e);return{a:en.filter(x=>x.who==="alex").reduce((s,x)=>s+x.score,0),l:en.filter(x=>x.who==="liam").reduce((s,x)=>s+x.score,0),g:en.filter(x=>x.who==="guest").reduce((s,x)=>s+x.score,0),lbl:i===3?"This wk":i===2?"Last wk":(4-i)+"w ago"};});
  const hasD=wks.some(w=>w.a+w.l+w.g>0);
  if(!hasD)return`<div style="text-align:center;padding:20px 0;color:#CCC;font-size:12px">Tick off chores to see 4-week history</div>`;
  const max=Math.max(...wks.map(w=>w.a+w.l+w.g),1),bW=42,gap=14,H=90;
  const bars=wks.map((w,i)=>{const x=i*(bW+gap)+10,tot=w.a+w.l+w.g,aH=(w.a/max)*H,lH=(w.l/max)*H,gH=(w.g/max)*H,lY=H-lH,gY=lY-gH,aY=gY-aH,ap=tot>0?Math.round((w.a/(w.a+w.l||1))*100):null,ub=ap!==null&&(ap>60||ap<40);return`<g transform="translate(${x},0)"><rect x="0" y="0" width="${bW}" height="${H}" rx="6" fill="#F5F2EF"/>${lH>0?`<rect x="0" y="${lY}" width="${bW}" height="${lH}" fill="${PEOPLE.liam.color}"/>`:""}${gH>0?`<rect x="0" y="${gY}" width="${bW}" height="${gH}" fill="#F5D98A"/>`:""}${aH>0?`<rect x="0" y="${aY}" width="${bW}" height="${aH}" fill="${PEOPLE.alex.color}"/>`:""}${ub?`<circle cx="${bW-5}" cy="${aY-7}" r="4" fill="#D06060"/>`:""}${ap!==null?`<text x="${bW/2}" y="${aY-10}" text-anchor="middle" font-size="9" font-weight="700" font-family="DM Sans,sans-serif" fill="${ub?"#D06060":"#AAA"}">${ap}/${100-ap}</text>`:""}
    <text x="${bW/2}" y="${H+14}" text-anchor="middle" font-size="10" font-family="DM Sans,sans-serif" fill="#AAA">${w.lbl}</text>
    ${tot>0?`<text x="${bW/2}" y="${H+26}" text-anchor="middle" font-size="9" font-family="DM Sans,sans-serif" fill="#CCC">${Math.round(tot)}pts</text>`:""}</g>`;}).join("");
  return`<svg width="100%" viewBox="0 0 ${wks.length*(bW+gap)+20} ${H+36}" overflow="visible">${bars}</svg><div style="display:flex;gap:12px;justify-content:center;margin-top:6px;flex-wrap:wrap">${[["#F2A4C0","Alex"],["#82C4F0","Liam"],["#F5D98A","Guest"]].map(([c,n])=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#AAA"><div style="width:10px;height:10px;border-radius:2px;background:${c}"></div>${n}</div>`).join("")}<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#AAA"><div style="width:8px;height:8px;border-radius:50%;background:#D06060"></div>Imbalanced</div></div>`;
}
function toggleChart(){chartOn=!chartOn;rStats();}

function rChores(){
  let vis=chores.filter(c=>{
    const ck=cat==="all"||c.category===cat;
    const pk=person==="everyone"?true:person==="overdue"?od(c):person==="alex"?(c.owner==="alex"||(c.owner==="rotate"&&c.rotationTurn==="alex")):(c.owner==="liam"||(c.owner==="rotate"&&c.rotationTurn==="liam"));
    return ck&&pk;
  }).sort((a,b)=>{const ao=od(a)?0:1,bo=od(b)?0:1;if(ao!==bo)return ao-bo;return(ds(b.lastDone)||9999)-(ds(a.lastDone)||9999);});
  const cl=CATS.find(x=>x.key===cat)?.label||"All";
  document.getElementById("sec-title").innerHTML=`${cl} <span style="font-size:12px;font-weight:400;color:#AAA;font-family:'DM Sans',sans-serif">${vis.length} chore${vis.length!==1?"s":""}</span>`;
  const el=document.getElementById("empty-msg"),li=document.getElementById("chore-list");
  if(!vis.length){el.style.display="block";li.innerHTML="";}
  else{el.style.display="none";li.innerHTML=vis.map(cCard).join("");}
}

function cCard(c){
  const done=c.subtasks.filter(s=>s.done).length,tot=c.subtasks.length,pct=tot>0?Math.round((done/tot)*100):0;
  const p=PEOPLE[own(c)],isR=c.owner==="rotate",ov=od(c),score=sc(c).toFixed(1),exp=c._exp||false;
  const d=ds(c.lastDone);
  let lb=d===null?`<span class="blast" style="color:#bbb">Never done</span>`:d===0?`<span class="blast" style="color:#5BAD7A;font-weight:700">Done today</span>`:d===1?`<span class="blast" style="color:#5BAD7A">Yesterday</span>`:`<span class="blast" style="color:${d>=(ODD[c.frequency]||9)?"#D06060":"#A0906A"};font-weight:${d>=(ODD[c.frequency]||9)?700:400}">${d>=(ODD[c.frequency]||9)?"! ":""}${d}d ago</span>`;
  const cb=c.coveredBy==="guest"?`<span class="bguest">guest did it</span>`:c.coveredBy?`<span class="bcov">covered ${PEOPLE[c.coveredBy]?.emoji||""}</span>`:"";
  const sz=38,r=(sz-7)/2,ci=2*Math.PI*r,off=ci-(pct/100)*ci;
  const ring=`<svg class="ring" width="${sz}" height="${sz}" style="flex-shrink:0"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#EDEDED" stroke-width="6"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c.accent}" stroke-width="6" stroke-dasharray="${ci.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" stroke-linecap="round"/></svg>`;
  const sts=c.subtasks.map(s=>`<div class="subtask${s.done?" done":""}" onclick="togST(${c.id},'${s.id}')" style="${s.done?"background:"+c.accent+"22":""}"><div class="scheck" style="border-color:${s.done?c.accent:"#DDD"};background:${s.done?c.accent:"white"}">${s.done?"✓":""}</div><span class="stext">${s.text}</span></div>`).join("");
  const cb2=done===tot?`<button class="comp-btn" style="background:linear-gradient(135deg,${c.accent},${c.accent}CC);box-shadow:0 4px 14px rgba(${h2r(c.accent)},.35)" onclick="compChore(${c.id})">All done — log it!</button>`:"";
  return`<div class="chore-card${ov?" ":" "}" id="card-${c.id}"><div class="card-stripe" style="background:${c.accent}"></div><div class="card-header"><div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer" onclick="togExp(${c.id})">${ring}<div class="card-info"><div class="card-name-row"><span style="font-size:14px">${c.icon}</span><span class="card-name">${c.name}</span></div><div class="card-badges"><span class="badge" style="background:${p.color}30;color:${p.color};border-color:${p.color}50">${p.emoji} ${isR?p.name+"s turn":p.name}</span><span class="bfreq">${FL[c.frequency]||c.frequency}</span><span class="bscore">&#9878; ${score}</span>${lb}${cb}</div></div></div><div class="card-right"><span class="card-count">${done}/${tot}</span><button class="swap-btn" onclick="event.stopPropagation();openSwap(${c.id})">&#8644;</button><span class="xarrow${exp?" open":""}" onclick="togExp(${c.id})">&#9660;</span></div></div><div class="card-subtasks${exp?" open":""}">${sts}${cb2}</div></div>`;
}

function setCat(k){cat=k;rTabs();rChores();}
function setPers(k){person=k;rPills();rChores();}
function togExp(id){const c=chores.find(x=>x.id==id);if(c){c._exp=!c._exp;rChores();}}
function togST(cid,sid){const c=chores.find(x=>x.id==cid);if(!c)return;const s=c.subtasks.find(x=>x.id===sid);if(s)s.done=!s.done;save();rChores();}
function compChore(id){const c=chores.find(x=>x.id==id);if(!c)return;const who=c.owner==="rotate"?c.rotationTurn:c.owner;logA(c,who);c.subtasks.forEach(s=>s.done=false);c.lastDone=new Date().toISOString();c.coveredBy=null;c._exp=false;if(c.owner==="rotate")c.rotationTurn=c.rotationTurn==="alex"?"liam":"alex";save();toast("🎉 "+c.name,"#1C1C2E");render();}
function chkImbal(){const{a,t}=loads();const ap=Math.round((a/t)*100),lp=100-ap;const ov=ap>60?"Alex 🌸":lp>60?"Liam ⚡":null;if(ov){if(!imbalStart||imbalStart.person!==ov){imbalStart={person:ov,since:Date.now()};sbUpsert("chores",[{id:"__meta__",data:{imbalance:imbalStart}}]);}}else if(imbalStart){imbalStart=null;sbUpsert("chores",[{id:"__meta__",data:{imbalance:null}}]);}}

let tTimer;
function toast(msg,col="#1C1C2E"){const el=document.getElementById("toast");el.textContent=msg;el.style.background=col;el.style.display="block";el.style.opacity="1";clearTimeout(tTimer);tTimer=setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.style.display="none",300);},2800);}

function closeModal(){document.getElementById("mc").innerHTML="";}

function openSwap(id){
  const c=chores.find(x=>x.id==id);if(!c)return;
  const isR=c.owner==="rotate",cur=own(c),oth=cur==="alex"?"liam":"alex",curP=PEOPLE[cur],othP=PEOPLE[oth];
  const fp=Object.entries(FL).map(([k,v])=>`<button class="fpill${c.frequency===k?" active":""}" onclick="chFreq(${id},'${k}')">${v}</button>`).join("");
  const ts=isR?`<button class="mbtn" style="border-color:#F0E0F8;background:#FBF5FD" onclick="mkOwned(${id},'alex')"><span class="mbtn-icon">🌸</span><div><div class="mbtn-title">Make Alex permanent</div><div class="mbtn-sub">Removes from rotation</div></div></button><button class="mbtn" style="border-color:#E0EEF8;background:#F5F8FD" onclick="mkOwned(${id},'liam')"><span class="mbtn-icon">⚡</span><div><div class="mbtn-title">Make Liam permanent</div><div class="mbtn-sub">Removes from rotation</div></div></button>`:`<button class="mbtn" style="border-color:#E0F0E0;background:#F5FBF5" onclick="mkRot(${id})"><span class="mbtn-icon">🔄</span><div><div class="mbtn-title">Make rotating</div><div class="mbtn-sub">Both take turns — starting with ${curP.name}</div></div></button>`;
  document.getElementById("mc").innerHTML=`<div class="mbdrop" onclick="closeModal()"><div class="mbsheet" onclick="event.stopPropagation()"><div class="mhandle"></div><div class="mtitle">${c.icon} ${c.name}</div><div style="margin-bottom:12px"><span class="badge" style="background:${curP.color}30;color:${curP.color};border-color:${curP.color}50">${isR?"🔄 Rotating — "+curP.name+"s turn":curP.emoji+" "+curP.name}</span></div><span class="slbl">Change frequency</span><div class="fpills">${fp}</div><span class="slbl">One-time cover</span><button class="mbtn" onclick="coverChore(${id},'${oth}')"><span class="mbtn-icon">${othP.emoji}</span><div><div class="mbtn-title">${othP.name} will do it this time</div><div class="mbtn-sub">Logs as covered, ownership stays same</div></div></button><button class="mbtn" style="border-color:#F5ECD8;background:#FFFAF3" onclick="coverChore(${id},'guest')"><span class="mbtn-icon">🧑‍🤝‍🧑</span><div><div class="mbtn-title">A guest or helper did it</div><div class="mbtn-sub">Logs as done, neither gets credit</div></div></button><span class="slbl">Permanent transfer</span><button class="mbtn" style="border-color:#E0E8F8;background:#F5F8FD" onclick="swapOwn(${id})"><span class="mbtn-icon">🔁</span><div><div class="mbtn-title">${isR?"Give to "+othP.name+" on rotation":"Transfer to "+othP.name}</div><div class="mbtn-sub">${isR?"Next turn goes to "+othP.name:othP.name+" takes over"}</div></div></button><span class="slbl">Change type</span>${ts}<button class="cbtn" onclick="closeModal()">Cancel</button><button class="ebtn" onclick="openEdit(${id})">✏️ Edit name, subtasks or scoring</button></div></div>`;
}
function chFreq(id,f){const c=chores.find(x=>x.id==id);if(!c)return;c.frequency=f;save();toast("🔁 "+c.name+" — "+FL[f],"#3A70C4");openSwap(id);render();}
function coverChore(id,who){const c=chores.find(x=>x.id==id);if(!c)return;logA(c,who);c.subtasks.forEach(s=>s.done=false);c.lastDone=new Date().toISOString();c.coveredBy=who;if(who!=="guest"&&c.owner==="rotate")c.rotationTurn=c.rotationTurn==="alex"?"liam":"alex";save();closeModal();toast(who==="guest"?"🧑‍🤝‍🧑 Guest did "+c.name:"🤝 "+PEOPLE[who].name+" covered "+c.name,"#4AAD7A");render();}
function swapOwn(id){const c=chores.find(x=>x.id==id);if(!c)return;const cur=own(c),oth=cur==="alex"?"liam":"alex";if(c.owner==="rotate")c.rotationTurn=oth;else c.owner=oth;save();closeModal();toast("🔁 "+c.name+" — "+PEOPLE[oth].name,"#3A70C4");render();}
function mkOwned(id,p){const c=chores.find(x=>x.id==id);if(!c)return;delete c.rotationTurn;c.owner=p;save();closeModal();toast("🔁 "+c.name+" — "+PEOPLE[p].name+" (permanent)","#3A70C4");render();}
function mkRot(id){const c=chores.find(x=>x.id==id);if(!c)return;c.rotationTurn=c.owner;c.owner="rotate";save();closeModal();toast("🔄 "+c.name+" now rotating","#3A70C4");render();}

function openEdit(id){
  const c=chores.find(x=>x.id==id);if(!c)return;
  const w=CW[c.id]||{e:2,m:1};const ef=c.effort||w.e,ml=c.mentalLoad||w.m;
  closeModal();
  window._es={id,freq:c.frequency,icon:c.icon,effort:ef,mental:ml};
  const fp=Object.entries(FL).map(([k,v])=>`<button class="fpill${c.frequency===k?" active":""}" onclick="eFreq(this,'${k}')">${v}</button>`).join("");
  const ig=ICONS.map(ic=>`<button class="iopt${c.icon===ic?" active":""}" onclick="eIcon(this,'${ic}')">${ic}</button>`).join("");
  const co=COPTS.map(o=>`<option value="${o.key}"${c.category===o.key?" selected":""}>${o.label}</option>`).join("");
  const eb=[{v:1,l:"Light",s:"easy"},{v:2,l:"Moderate",s:"effort"},{v:3,l:"Heavy",s:"tiring"},{v:4,l:"Hard",s:"demanding"}].map(o=>`<button class="tbtn${ef===o.v?" active":""}" onclick="eEffort(this,${o.v})">${o.l}<br><span style="font-size:9px;opacity:.7;font-weight:400">${o.s}</span></button>`).join("");
  const mb=[{v:1,l:"Low",s:"do it"},{v:2,l:"Medium",s:"tracking"},{v:3,l:"High",s:"thinking"}].map(o=>`<button class="tbtn${ml===o.v?" active":""}" onclick="eMental(this,${o.v})">${o.l}<br><span style="font-size:9px;opacity:.7;font-weight:400">${o.s}</span></button>`).join("");
  const sr=c.subtasks.map(s=>`<div class="strow" id="sr-${s.id}"><span>${s.text}</span><button onclick="eRmST('${s.id}')">x</button></div>`).join("");
  const score=((FPM[c.frequency]||1)*ef*ml).toFixed(1);
  document.getElementById("mc").innerHTML=`<div class="mbdrop" onclick="closeModal()"><div class="mbsheet" onclick="event.stopPropagation()"><div class="mhandle"></div><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px"><div><div class="mtitle">Edit chore</div><div class="msub">Changes save immediately</div></div><div id="da"><button onclick="showDel()" style="padding:6px 12px;border-radius:8px;border:1.5px solid #F0D8D8;background:#FEF5F5;color:#C06060;font-size:12px;font-weight:700;cursor:pointer">Delete</button></div></div><span class="slbl">Name</span><input class="ifield" id="en" value="${c.name}"><span class="slbl">Icon</span><div class="igrid">${ig}</div><span class="slbl">Category</span><select class="ifield" id="ec">${co}</select><span class="slbl">Frequency</span><div class="fpills" id="efp">${fp}</div><span class="slbl">Effort</span><div class="tbtns">${eb}</div><span class="slbl">Mental load</span><div class="tbtns">${mb}</div><div class="sprev"><span style="font-size:11px;color:#AAA">Monthly load score</span><span style="font-size:13px;font-weight:700;color:#1C1C2E" id="esp">${score}</span></div><span class="slbl">Subtasks</span><div id="esl">${sr}</div><div class="stadd"><input class="ifield" id="enst" placeholder="Add step, Enter" onkeydown="if(event.key==='Enter')eAddST(${id})"><button onclick="eAddST(${id})" style="padding:10px 14px;border-radius:10px;border:none;background:#1C1C2E;color:white;font-size:18px;cursor:pointer;flex-shrink:0">+</button></div><button class="savebtn" style="background:linear-gradient(135deg,#4BAD7A,#3A9060)" onclick="saveEdit(${id})">Save changes</button><button class="cbtn" onclick="closeModal()">Cancel</button></div></div>`;
}
function eFreq(b,f){window._es.freq=f;b.closest(".fpills").querySelectorAll(".fpill").forEach(x=>x.classList.remove("active"));b.classList.add("active");eUpdScore();}
function eIcon(b,ic){window._es.icon=ic;b.closest(".igrid").querySelectorAll(".iopt").forEach(x=>x.classList.remove("active"));b.classList.add("active");}
function eEffort(b,v){window._es.effort=v;b.closest(".tbtns").querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");eUpdScore();}
function eMental(b,v){window._es.mental=v;b.closest(".tbtns").querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");eUpdScore();}
function eUpdScore(){const s=window._es;const el=document.getElementById("esp");if(el)el.textContent=((FPM[s.freq]||1)*s.effort*s.mental).toFixed(1);}
function eAddST(cid){const inp=document.getElementById("enst");const t=inp.value.trim();if(!t)return;const c=chores.find(x=>x.id==cid);if(!c)return;const ns={id:"s"+Date.now(),text:t,done:false};c.subtasks.push(ns);const r=document.createElement("div");r.className="strow";r.id="sr-"+ns.id;r.innerHTML=`<span>${t}</span><button onclick="eRmST('${ns.id}')">x</button>`;document.getElementById("esl").appendChild(r);inp.value="";}
function eRmST(sid){const el=document.getElementById("sr-"+sid);if(el)el.remove();chores.forEach(c=>{c.subtasks=c.subtasks.filter(s=>s.id!==sid);});}
function showDel(){document.getElementById("da").innerHTML=`<div><p style="font-size:11px;color:#C06060;font-weight:600;text-align:right;margin-bottom:4px">Sure?</p><div style="display:flex;gap:6px;justify-content:flex-end"><button onclick="openEdit(${window._es.id})" style="padding:5px 10px;border-radius:7px;border:1px solid #E0E0E0;background:white;color:#888;font-size:11px;cursor:pointer">Keep</button><button onclick="delChore(${window._es.id})" style="padding:5px 10px;border-radius:7px;border:none;background:#D06060;color:white;font-size:11px;font-weight:700;cursor:pointer">Delete</button></div></div>`;}
function delChore(id){const c=chores.find(x=>x.id==id);chores=chores.filter(x=>x.id!=id);save();closeModal();toast("Removed "+(c?.name||""),"#888");render();}
function saveEdit(id){const c=chores.find(x=>x.id==id);if(!c)return;const s=window._es;c.name=document.getElementById("en").value.trim()||c.name;c.icon=s.icon;c.category=document.getElementById("ec").value;c.frequency=s.freq;c.effort=s.effort;c.mentalLoad=s.mental;save();closeModal();toast("✏️ "+c.name+" updated","#3A70C4");render();}

function openAddModal(){
  window._as={icon:"🧹",freq:"weekly",owner:"rotate",rot:"alex",effort:2,mental:1,sts:[]};
  const ig=ICONS.map(ic=>`<button class="iopt${ic==="🧹"?" active":""}" onclick="aIcon(this,'${ic}')">${ic}</button>`).join("");
  const co=COPTS.map(o=>`<option value="${o.key}">${o.label}</option>`).join("");
  const fp=Object.entries(FL).map(([k,v])=>`<button class="fpill${k==="weekly"?" active":""}" onclick="aFreq(this,'${k}')">${v}</button>`).join("");
  const eb=[{v:1,l:"Light",s:"easy"},{v:2,l:"Moderate",s:"effort"},{v:3,l:"Heavy",s:"tiring"},{v:4,l:"Hard",s:"demanding"}].map(o=>`<button class="tbtn${o.v===2?" active":""}" onclick="aEffort(this,${o.v})">${o.l}<br><span style="font-size:9px;opacity:.7;font-weight:400">${o.s}</span></button>`).join("");
  const mb=[{v:1,l:"Low",s:"do it"},{v:2,l:"Medium",s:"tracking"},{v:3,l:"High",s:"thinking"}].map(o=>`<button class="tbtn${o.v===1?" active":""}" onclick="aMental(this,${o.v})">${o.l}<br><span style="font-size:9px;opacity:.7;font-weight:400">${o.s}</span></button>`).join("");
  document.getElementById("mc").innerHTML=`<div class="mbdrop" onclick="closeModal()"><div class="mbsheet" onclick="event.stopPropagation()"><div class="mhandle"></div><div class="mtitle">Add a new chore</div><div class="msub">Fill in what you can, change later via swap</div><span class="slbl">Name</span><input class="ifield" id="an" placeholder="e.g. Clean blinds" oninput="aUpdSave()"><span class="slbl">Icon</span><div class="igrid">${ig}</div><span class="slbl">Category</span><select class="ifield" id="ac">${co}</select><span class="slbl">Frequency</span><div class="fpills">${fp}</div><span class="slbl">Effort</span><div class="tbtns">${eb}</div><span class="slbl">Mental load</span><div class="tbtns">${mb}</div><div class="sprev"><span style="font-size:11px;color:#AAA">Monthly load score</span><span style="font-size:13px;font-weight:700;color:#1C1C2E" id="asp">8.0</span></div><span class="slbl">Owner</span><div class="tbtns"><button class="tbtn" onclick="aOwner(this,'alex')">🌸 Alex</button><button class="tbtn" onclick="aOwner(this,'liam')">⚡ Liam</button><button class="tbtn active" onclick="aOwner(this,'rotate')">🔄 Rotating</button></div><div id="art" style="margin-top:8px"><p style="font-size:11px;color:#AAA;margin-bottom:7px">Who goes first?</p><div class="tbtns"><button class="tbtn active" onclick="aRot(this,'alex')">Alex 🌸</button><button class="tbtn" onclick="aRot(this,'liam')">Liam ⚡</button></div></div><span class="slbl">Subtasks (optional)</span><div id="asl"></div><div class="stadd"><input class="ifield" id="anst" placeholder="Add step, Enter" onkeydown="if(event.key==='Enter')aAddST()"><button onclick="aAddST()" style="padding:10px 14px;border-radius:10px;border:none;background:#1C1C2E;color:white;font-size:18px;cursor:pointer;flex-shrink:0">+</button></div><button class="savebtn" id="asb" disabled style="background:#E0E0E0;color:#AAA;cursor:default" onclick="saveAdd()">Add chore</button><button class="cbtn" onclick="closeModal()">Cancel</button></div></div>`;
}
function aIcon(b,ic){window._as.icon=ic;b.closest(".igrid").querySelectorAll(".iopt").forEach(x=>x.classList.remove("active"));b.classList.add("active");}
function aFreq(b,f){window._as.freq=f;b.closest(".fpills").querySelectorAll(".fpill").forEach(x=>x.classList.remove("active"));b.classList.add("active");aUpdScore();}
function aEffort(b,v){window._as.effort=v;b.closest(".tbtns").querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");aUpdScore();}
function aMental(b,v){window._as.mental=v;b.closest(".tbtns").querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");aUpdScore();}
function aOwner(b,o){window._as.owner=o;b.closest(".tbtns").querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("art").style.display=o==="rotate"?"block":"none";}
function aRot(b,t){window._as.rot=t;b.closest(".tbtns").querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");}
function aUpdScore(){const s=window._as;const el=document.getElementById("asp");if(el)el.textContent=((FPM[s.freq]||1)*s.effort*s.mental).toFixed(1);}
function aUpdSave(){const n=document.getElementById("an")?.value.trim();const b=document.getElementById("asb");if(!b)return;if(n){b.disabled=false;b.style.cssText="background:linear-gradient(135deg,#3A70C4,#2A50A4);color:white;cursor:pointer;box-shadow:0 4px 14px rgba(58,112,196,.35)";}else{b.disabled=true;b.style.cssText="background:#E0E0E0;color:#AAA;cursor:default;box-shadow:none";}}
function aAddST(){const inp=document.getElementById("anst");const t=inp.value.trim();if(!t)return;const id="n"+Date.now();window._as.sts.push({id,text:t,done:false});const r=document.createElement("div");r.className="strow";r.id="ns-"+id;r.innerHTML=`<span>${t}</span><button onclick="aRmST('${id}')">x</button>`;document.getElementById("asl").appendChild(r);inp.value="";}
function aRmST(id){const r=document.getElementById("ns-"+id);if(r)r.remove();window._as.sts=window._as.sts.filter(s=>s.id!==id);}
function saveAdd(){const n=document.getElementById("an")?.value.trim();if(!n)return;const s=window._as;const AC=["#E8749A","#3A90D4","#4BAD7A","#C08040","#9B59A0","#5590C0","#E05050","#6AA840"];const id=nid();const nc={id,name:n,icon:s.icon,accent:AC[id%AC.length],category:document.getElementById("ac").value,owner:s.owner,effort:s.effort,mentalLoad:s.mental,frequency:s.freq,subtasks:s.sts.length>0?s.sts:[{id:id+"-a",text:"Do "+n.toLowerCase(),done:false}],lastDone:null};if(s.owner==="rotate")nc.rotationTurn=s.rot;chores.push(nc);save();closeModal();toast("Added "+n,"#1C1C2E");render();}

boot();
</script></body></html>
